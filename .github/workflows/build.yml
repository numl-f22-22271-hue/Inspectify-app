name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  #  WINDOWS — single .exe
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (single-file Windows EXE)
        run: dotnet publish "PC inspect beta/PC inspect beta.csproj" -c Release -r win-x64 -f net8.0-windows --self-contained -o publish/win

      - name: Rename for clarity
        shell: pwsh
        run: |
          Rename-Item "publish/win/InspectifyScanner.exe" "InspectifyScanner-Windows.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: publish/win/InspectifyScanner-Windows.exe

  # ──────────────────────────────────────────────
  #  macOS — single .app bundle in .dmg
  # ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (Apple Silicon)
        run: dotnet publish "PC inspect beta/PC inspect beta.csproj" -c Release -r osx-arm64 -f net8.0 --self-contained -o publish/mac-arm64

      - name: Publish (Intel Mac)
        run: dotnet publish "PC inspect beta/PC inspect beta.csproj" -c Release -r osx-x64 -f net8.0 --self-contained -o publish/mac-x64

      - name: Create .app bundle (Apple Silicon) + .dmg
        run: |
          APPDIR="InspectifyScanner.app/Contents"
          mkdir -p "$APPDIR/MacOS"
          mkdir -p "$APPDIR/Resources"
          cp -r publish/mac-arm64/* "$APPDIR/MacOS/"
          chmod +x "$APPDIR/MacOS/InspectifyScanner"

          cat > "$APPDIR/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>InspectifyScanner</string>
              <key>CFBundleIdentifier</key>
              <string>com.inspectifylapstore.scanner</string>
              <key>CFBundleName</key>
              <string>Inspectify Scanner</string>
              <key>CFBundleDisplayName</key>
              <string>Inspectify Scanner</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          mkdir dmg-staging
          cp -r InspectifyScanner.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Inspectify Scanner" -srcfolder dmg-staging -ov -format UDZO InspectifyScanner-macOS.dmg

      - name: Zip Intel Mac build
        run: cd publish/mac-x64 && zip -r ../../InspectifyScanner-macOS-Intel.zip .

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            InspectifyScanner-macOS.dmg
            InspectifyScanner-macOS-Intel.zip

  # ──────────────────────────────────────────────
  #  LINUX — single binary
  # ──────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (single binary, Linux x64)
        run: dotnet publish "PC inspect beta/PC inspect beta.csproj" -c Release -r linux-x64 -f net8.0 --self-contained -o publish/linux

      - name: Make executable + tar.gz
        run: |
          chmod +x publish/linux/InspectifyScanner
          cd publish/linux && tar -czf ../../InspectifyScanner-Linux.tar.gz InspectifyScanner

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: InspectifyScanner-Linux.tar.gz

  # ──────────────────────────────────────────────
  #  RELEASE — combine all artifacts
  # ──────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/win

      - uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts/mac

      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/win/InspectifyScanner-Windows.exe
            artifacts/mac/InspectifyScanner-macOS.dmg
            artifacts/mac/InspectifyScanner-macOS-Intel.zip
            artifacts/linux/InspectifyScanner-Linux.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Inspectify Scanner

            Hardware inspection tool for [Inspectify LapStore](https://inspectifylapstore.me).

            ### Downloads

            - **Windows** (single .exe): `InspectifyScanner-Windows.exe` — double-click to run
            - **macOS Apple Silicon** (M1/M2/M3/M4): `InspectifyScanner-macOS.dmg` — open DMG, drag to Applications
            - **macOS Intel**: `InspectifyScanner-macOS-Intel.zip`
            - **Linux**: `InspectifyScanner-Linux.tar.gz` — extract and run

            No installation required — just download and run.
