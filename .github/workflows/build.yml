name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  PROJ: "PC inspect beta/PC inspect beta.csproj"
  CONFIG: Release
  FRAMEWORK: net8.0

jobs:
  # ──────────────────────────────────────────────
  #  WINDOWS — single .exe, no .NET install needed
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file Windows EXE
        run: >
          dotnet publish "${{ env.PROJ }}"
          -c ${{ env.CONFIG }}
          -f ${{ env.FRAMEWORK }}
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/win

      - name: Rename artifact
        shell: pwsh
        run: |
          Get-ChildItem publish/win -Filter *.exe
          Rename-Item "publish/win/InspectifyScanner.exe" "InspectifyScanner-Windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: publish/win/InspectifyScanner-Windows-x64.exe

  # ──────────────────────────────────────────────
  #  macOS — Apple Silicon (M-series)
  # ──────────────────────────────────────────────
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file (Apple Silicon)
        run: >
          dotnet publish "${{ env.PROJ }}"
          -c ${{ env.CONFIG }}
          -f ${{ env.FRAMEWORK }}
          -r osx-arm64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/mac-arm64

      - name: Create .app bundle + DMG (Apple Silicon)
        run: |
          set -e
          APP="InspectifyScanner.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          mv publish/mac-arm64/InspectifyScanner "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/InspectifyScanner"
          rm -rf publish "PC inspect beta/bin" "PC inspect beta/obj"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0">' '<dict>' '  <key>CFBundleExecutable</key><string>InspectifyScanner</string>' '  <key>CFBundleIdentifier</key><string>me.inspectifylapstore.scanner</string>' '  <key>CFBundleName</key><string>Inspectify Scanner</string>' '  <key>CFBundleDisplayName</key><string>Inspectify Scanner</string>' '  <key>CFBundleShortVersionString</key><string>2.0.0</string>' '  <key>CFBundleVersion</key><string>2</string>' '  <key>CFBundlePackageType</key><string>APPL</string>' '  <key>LSMinimumSystemVersion</key><string>11.0</string>' '  <key>NSHighResolutionCapable</key><true/>' '</dict>' '</plist>' > "$APP/Contents/Info.plist"
          xattr -cr "$APP"
          mkdir dmg-staging
          mv "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          SRC_MB=$(du -sm dmg-staging | awk '{print $1}')
          IMG_MB=$(( SRC_MB + 50 ))
          echo "Source: ${SRC_MB}MB, Image: ${IMG_MB}MB"
          hdiutil create -volname "Inspectify Scanner" -fs HFS+ -size "${IMG_MB}m" temp-rw.dmg
          MOUNT_DIR=$(hdiutil attach temp-rw.dmg | tail -1 | awk -F'\t' '{print $NF}')
          cp -R dmg-staging/* "$MOUNT_DIR/"
          hdiutil detach "$MOUNT_DIR"
          hdiutil convert temp-rw.dmg -format UDZO -o InspectifyScanner-macOS-AppleSilicon.dmg
          rm -f temp-rw.dmg
          rm -rf dmg-staging

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-build
          path: InspectifyScanner-macOS-AppleSilicon.dmg

  # ──────────────────────────────────────────────
  #  macOS — Intel
  # ──────────────────────────────────────────────
  build-macos-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file (Intel Mac)
        run: >
          dotnet publish "${{ env.PROJ }}"
          -c ${{ env.CONFIG }}
          -f ${{ env.FRAMEWORK }}
          -r osx-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/mac-x64

      - name: Create .app bundle + DMG (Intel)
        run: |
          set -e
          APP="InspectifyScanner.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          mv publish/mac-x64/InspectifyScanner "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/InspectifyScanner"
          rm -rf publish
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0">' '<dict>' '  <key>CFBundleExecutable</key><string>InspectifyScanner</string>' '  <key>CFBundleIdentifier</key><string>me.inspectifylapstore.scanner</string>' '  <key>CFBundleName</key><string>Inspectify Scanner</string>' '  <key>CFBundleDisplayName</key><string>Inspectify Scanner</string>' '  <key>CFBundleShortVersionString</key><string>2.0.0</string>' '  <key>CFBundleVersion</key><string>2</string>' '  <key>CFBundlePackageType</key><string>APPL</string>' '  <key>LSMinimumSystemVersion</key><string>10.15</string>' '  <key>NSHighResolutionCapable</key><true/>' '</dict>' '</plist>' > "$APP/Contents/Info.plist"
          xattr -cr "$APP"
          mkdir dmg-staging
          mv "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Inspectify Scanner" -srcfolder dmg-staging -ov -format UDZO InspectifyScanner-macOS-Intel.dmg
          rm -rf dmg-staging

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-build
          path: InspectifyScanner-macOS-Intel.dmg

  # ──────────────────────────────────────────────
  #  LINUX — single binary, no install needed
  # ──────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Avalonia Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxi-dev libxxf86vm-dev \
            libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev \
            libicu-dev

      - name: Publish single-file Linux binary
        run: >
          dotnet publish "${{ env.PROJ }}"
          -c ${{ env.CONFIG }}
          -f ${{ env.FRAMEWORK }}
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/linux

      - name: Make executable
        run: |
          chmod +x publish/linux/InspectifyScanner
          cp publish/linux/InspectifyScanner InspectifyScanner-Linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: InspectifyScanner-Linux-x64

  # ──────────────────────────────────────────────
  #  RELEASE — attach all binaries to the tag
  # ──────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos-arm64, build-macos-x64, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: windows-build, path: artifacts/win }
      - uses: actions/download-artifact@v4
        with: { name: macos-arm64-build, path: artifacts/mac-arm64 }
      - uses: actions/download-artifact@v4
        with: { name: macos-x64-build, path: artifacts/mac-x64 }
      - uses: actions/download-artifact@v4
        with: { name: linux-build, path: artifacts/linux }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/win/InspectifyScanner-Windows-x64.exe
            artifacts/mac-arm64/InspectifyScanner-macOS-AppleSilicon.dmg
            artifacts/mac-x64/InspectifyScanner-macOS-Intel.dmg
            artifacts/linux/InspectifyScanner-Linux-x64
          body: |
            ## Inspectify Scanner

            Hardware inspection + marketplace tool for [Inspectify LapStore](https://inspectifylapstore.me).

            ### Downloads — just download and run, no installation required

            | Platform | File | How to run |
            |----------|------|------------|
            | **Windows 10/11** | `InspectifyScanner-Windows-x64.exe` | Double-click |
            | **macOS Apple Silicon** (M1–M4) | `InspectifyScanner-macOS-AppleSilicon.dmg` | Open DMG, drag to Applications |
            | **macOS Intel** | `InspectifyScanner-macOS-Intel.dmg` | Open DMG, drag to Applications |
            | **Linux x64** | `InspectifyScanner-Linux-x64` | `chmod +x` then run |

            > No .NET SDK or runtime required — everything is bundled inside each binary.

            ### macOS Users — Important First-Run Steps

            macOS Gatekeeper will block the app since it is not signed with an Apple Developer certificate. To fix this, **run this one-time command after dragging to Applications**:

            ```bash
            xattr -cr /Applications/InspectifyScanner.app
            ```

            Or: **Right-click** the app → **Open** → click **Open** in the dialog. macOS remembers your choice after the first launch.
